url: https://eguizarrosales.github.io/YouAnalyser/
template:
  bootstrap: 5

reference:
  - title: Data Processing
    desc: >
      Function to process survey data, including adding and inspecting 
      variable and value labels.
  - contents:
    - starts_with("dp_")
  - title: Exploratory Data Analysis (EDA)
    desc: >
      Functions to perform exploratory data analysis (EDA) on survey data, 
      including summary statistics and correlations.
  - contents:
    - starts_with("eda_")
  - title: Key Driver Analysis (KDA)
    desc: >
      Functions to perform KDA on survey data. `kda_regression()` is the main
      end-to-end function that runs the entire KDA process, while the other functions
      are helper functions that can be used to run specific steps of the KDA process.
  - contents:
    - starts_with("kda_")
  - title: Price Sensitivity Meter (PSM)
    desc: >
      Functions to perform Van Westendorp Price Sensitivity Meter Analysis,
      including the Newton Miller Smith Extension (NMS-Extension).
  - contents:
      - starts_with("psm_")
  - title: Segmentation (SEG)
    desc: >
      Functions to perform segmentation (cluster analysis) on survey data:
      preparation of the data and distance matrices, assessment of the
      clustering tendency, number of clusters and choice of the algorithm,
      cluster analysis with different algorithms, returning standardized
      solutions with visualizations, and validation of the cluster solutions
      with internal measures (silhouette width, Dunn index) and external
      measures (agreement with a reference grouping).
  - contents:
      - seg_prep_data
      - seg_distance
      - seg_clustering_tendency
      - seg_optimal_clusters
      - starts_with("seg_nbclust_")
      - seg_compare_algorithms
      - seg_cluster
      - starts_with("seg_cluster_")
      - seg_dbscan_eps
      - seg_as_cluster
      - seg_plot_cluster
      - seg_plot_dend
      - seg_plot_heatmap
      - seg_validation
      - seg_plot_silhouette
  - title: YouAnalyser (YA) Utility Functions
    desc: >
      Miscellaneous utility functions for the YouAnalyser package.
  - contents:
      - starts_with("ya_")
  - title: Example Data
    desc: >
      Example datasets included in the YouAnalyser package.
  - contents:
      - starts_with("bkw_")
      - starts_with("deka_")
      - starts_with("chm_")
      - starts_with("sm_")
      - sim_segments
  - title: Other Functions
    desc: >
      Other functions or data that do not fit into the above categories.
  - contents:
      - yougov_colors
      - yougov_palette
